<article class="blog-post">
    <header class="post-header">
        <p class="post-meta">
            $date$
            $if(draft)$
                <span class="tag">Draft</span>
            $endif$
        </p>
        <h1 class="title">$title$</h1>
    </header>
    <section class="post-body">
        $body$
    </section>
    <footer class="post-footer">
        <a href="$backUrl$">&larr; $backLabel$</a>
    </footer>
</article>
